<!-- Layover Coffee — digital loyalty card. Fully standalone from the POS automation-system:
     talks only to its own dedicated Apps Script backend (a new "Layover Loyalty" sheet/project,
     not "Layover Coffee Ops"). One file, several views, switched by URL params:
       ?code=XXXX               -> customer view (their card + a QR staff can scan to add a stamp)
       ?code=XXXX&staff=1       -> staff check-in view (add a stamp / redeem / reactivate)
       ?staff=1                 -> staff sign-up view (create a brand-new card, get a code + link)
       ?staff=1&broadcast=1     -> staff promo-blast view (queue a message to every active customer)

     A customer's Code/link never changes and never expires — it's a permanent row in the
     Customers sheet tab. The only way it stops working is if the customer deactivates it
     themselves (see the "Deactivate my card" link on their own card) or staff reactivates it.

     EDIT ME: API_URL below, once the Apps Script backend (see Code.gs) is deployed.
     logo.png must stay in the same folder as this file (same one the funnel page uses). -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layover Loyalty Stamp</title>
<!-- Add-to-Home-Screen support: lets a customer save THEIR OWN link (?code=XXXX and all) as
     an icon on their phone home screen, so the card is a one-tap-away shortcut instead of a
     browser bookmark they might lose track of. Deliberately no <link rel="manifest"> here —
     a manifest's start_url can override the page's current URL on Android's "Install app"
     flow, which would strip the customer's own ?code= and defeat the point. Plain "Add to
     Home Screen" (no manifest) reliably keeps the exact current URL on both iOS and Android. -->
<meta name="theme-color" content="#1e3fae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Layover Loyalty">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root {
    --blue: #1e3fae; --blue-dark: #142b78; --ink: #1c2438; --line: #dbe2f2; --muted: #6b7488;
    --gold: #c9962c; --gold-dark: #8f6a1c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif; margin: 0; min-height: 100vh;
    background: #f4f6fb; color: var(--ink);
    display: flex; justify-content: center;
  }
  .page { width: 100%; max-width: 420px; padding: 28px 18px 40px; }

  .logo-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom: 18px; font-size: 14px; }
  .logo-row img { width: 38px; height: 38px; }

  .card {
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    background-size: cover; background-position: center;
    border-radius: 18px; padding: 20px; color: #fff;
    box-shadow: 0 10px 24px rgba(20,43,120,0.25);
    border-top: 4px solid var(--gold);
  }
  .card-head { display:flex; justify-content: space-between; align-items:flex-start; }
  .card-head .title { font-size: 17px; font-weight: 800; letter-spacing: 0.4px; }
  .card-head .right { text-align: right; }
  .card-head .plane { font-size: 20px; }
  .card-head .sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .card-head .counter {
    font-size: 12px; font-weight: 800; margin-top: 5px;
    background: rgba(255,255,255,0.18); border-radius: 20px;
    padding: 3px 10px; display:inline-block; white-space:nowrap;
  }

  .ticket-divider {
    border-top: 1.5px dashed rgba(255,255,255,0.35);
    margin-top: 14px; padding-top: 8px;
    font-size: 10px; letter-spacing: 1px; opacity: 0.65; text-transform: uppercase;
  }

  .name-row {
    margin-top: 16px; background: rgba(255,255,255,0.12); border-radius: 10px;
    padding: 8px 12px; font-size: 13px;
  }
  .name-row .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.75; }
  .name-row .value { font-size: 15px; font-weight: 700; margin-top: 2px; }

  .stamp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 18px 0 6px; }
  .stamp {
    aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.5);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size: 8.5px; font-weight: 700; line-height:1.15; padding: 2px;
  }
  .stamp.filled { border-style: solid; border-color: #fff; background: rgba(255,255,255,0.92); color: var(--blue-dark); }

  .progress-text { text-align:center; font-size: 13px; margin-top: 10px; }

  .qr-wrap { text-align:center; margin-top: 18px; }
  .qr-wrap img { width: 140px; height: 140px; border-radius: 10px; background:#fff; padding: 8px; }
  .qr-wrap .hint { font-size: 11px; opacity: 0.85; margin-top: 6px; }

  .rewards { background:#fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .rewards h3 { font-size: 12px; text-transform: uppercase; letter-spacing:0.6px; color:var(--muted); margin: 0 0 8px; }
  .rewards ul { margin:0; padding-left: 18px; font-size: 13px; }
  .rewards li { margin-bottom: 4px; }

  .fine-print { margin-top: 16px; font-size: 11px; color: var(--muted); line-height:1.5; }
  .fine-print h4 { font-size: 11px; text-transform:uppercase; letter-spacing:0.5px; color: var(--ink); margin: 10px 0 3px; }
  .fine-print ul { margin: 0; padding-left: 16px; }

  .footer { text-align:center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  .footer .line1 { color: var(--blue); font-weight: 700; }

  .staff-box { background:#fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 18px; }
  .staff-box h2 { font-size: 15px; margin: 0 0 12px; }
  .staff-box input {
    width:100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; margin-bottom: 10px;
  }
  .btn {
    display:block; width:100%; text-align:center; border:none; border-radius:10px;
    padding: 12px; font-size: 14px; font-weight:700; cursor:pointer; margin-bottom:10px;
  }
  .btn.primary { background: var(--blue); color:#fff; }
  .btn.gold { background: var(--gold); color:#fff; }
  .msg { font-size: 13px; margin-top: 8px; text-align:center; min-height: 16px; }
  .msg.error { color:#b3261e; }
  .msg.ok { color:#1a7f37; }
  .stamp-success {
    background: #e6f7ec; border: 1px solid #1a7f37; color: #1a7f37;
    border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 700;
    text-align: center; margin-bottom: 12px;
  }
  .loading, .not-found { text-align:center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  .text-link {
    display:block; text-align:center; font-size: 12px; color: var(--muted);
    text-decoration: underline; background:none; border:none; cursor:pointer; margin-top: 18px; width:100%;
  }
  textarea.promo-input {
    width:100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; margin-bottom: 10px; font-family: inherit; resize: vertical;
  }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading">Loading your card…</div>
</div>

<script>
// EDIT ME: replace with the deployed Apps Script web app /exec URL (see Code.gs in this folder)
const API_URL = 'https://script.google.com/macros/s/AKfycbzSb1aF8xpiuXebxyjXCJxLETBC2jhobBk-B5XguqNkQr7orHpTeSQNbmOKqc6Dk68zng/exec';

// Stamp-number -> reward label. Matches the physical Layover Loyalty Stamp card.
const MILESTONE_LABELS = { 3: 'Extra Scoop', 6: 'Free Add-Ons', 7: '10% Off', 10: 'Free Vanilla Latte', 12: 'Free Coffee/Treat' };

const qs = new URLSearchParams(location.search);
const code = qs.get('code');
const isStaff = qs.get('staff') === '1';
const isBroadcast = qs.get('broadcast') === '1';
const isSelfStamp = qs.get('selfstamp') === '1';
const isSelfSignup = qs.get('signup') === '1';
const app = document.getElementById('app');

function pageUrl(extra) {
  const url = new URL(location.href);
  url.search = '?' + new URLSearchParams(extra).toString();
  return url.toString();
}

function stampGrid(stamps) {
  let html = '<div class="stamp-grid">';
  for (let i = 1; i <= 12; i++) {
    const filled = i <= stamps;
    const label = MILESTONE_LABELS[i] || '';
    html += `<div class="stamp ${filled ? 'filled' : ''}">${label || (filled ? '&#10003;' : i)}</div>`;
  }
  html += '</div>';
  return html;
}

function nextRewardText(state) {
  if (state.stamps >= 12) return '&#127881; <b>Free Coffee/Treat is ready!</b> Show this to staff.';
  const left = state.nextMilestone - state.stamps;
  return `<b>${left}</b> more stamp${left === 1 ? '' : 's'} for <b>${state.nextReward}</b>`;
}

function renderCancelled(state) {
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee</strong></div>
    <div class="staff-box">
      <h2>This card has been deactivated</h2>
      <p style="font-size:13px;color:var(--muted);">${escapeHtml(state.name)}'s loyalty card (${escapeHtml(state.code)}) is no longer active. Message us if this wasn't you, or to reactivate it.</p>
    </div>
    <div class="footer">
      <div class="line1">LAYOVER Coffee — In Transit</div>
      <div>+63 956 358 5888</div>
      <div>Bldg 16, unit 115 Urban Deca Homes<br>Hernan Cortes, Mandaue Cebu City</div>
    </div>
  `;
}

// Card background rotates through real product shots on every load, tinted with
// the brand blue gradient (photo alone is too busy behind stamps/QR/white text).
const CARD_PHOTOS = ['photos/brownies.jpg', 'photos/milo-mountain-halo-halo.jpg', 'photos/biscoff-brownies.jpg'];
function randomCardBackground() {
  const photo = CARD_PHOTOS[Math.floor(Math.random() * CARD_PHOTOS.length)];
  return `linear-gradient(135deg, rgba(30,63,174,0.6), rgba(20,43,120,0.68)), url('${photo}')`;
}

function renderCustomer(state) {
  if (state.cancelled) { renderCancelled(state); return; }
  const qrTarget = pageUrl({ code: state.code, staff: '1' });
  const qrImg = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(qrTarget);
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee</strong></div>
    <div class="card" style="background-image: ${randomCardBackground()}">
      <div class="card-head">
        <div>
          <div class="title">LAYOVER LOYALTY STAMP</div>
          <div class="sub">Drinks &amp; Treats</div>
        </div>
        <div class="right">
          <div class="plane">&#9992;</div>
          <div class="counter">${state.stamps}/12</div>
        </div>
      </div>
      <div class="ticket-divider">Boarding Pass &middot; Layover Coffee</div>
      <div class="name-row">
        <div class="label">Passenger Name</div>
        <div class="value">${escapeHtml(state.name)}</div>
      </div>
      ${stampGrid(state.stamps)}
      <div class="progress-text">${nextRewardText(state)}</div>
      <div class="qr-wrap">
        <img src="${qrImg}" alt="Staff check-in QR">
        <div class="hint">Send or show this QR code to Layover staff to add a stamp</div>
      </div>
    </div>

    <div class="rewards">
      <h3>Rewards Along the Way</h3>
      <ul>
        <li>3 stamps — Extra Scoop</li>
        <li>6 stamps — Free Add-Ons</li>
        <li>7 stamps — 10% Off</li>
        <li>10 stamps — Free Vanilla Latte</li>
        <li>12 stamps — Free Coffee/Treat (every 12th drink is on us!)</li>
      </ul>
    </div>

    <div class="rewards">
      <h3>Never Lose This Card</h3>
      <p style="font-size:13px;margin:0;">Add it to your phone's home screen so it's always one tap away: on iPhone tap <b>Share</b> then <b>Add to Home Screen</b>; on Android tap the <b>⋮ menu</b> then <b>Add to Home screen</b>.</p>
    </div>

    <div class="fine-print">
      <h4>Terms &amp; Conditions</h4>
      <ul>
        <li>One reward/redemption per transaction only.</li>
        <li>Rewards cannot be combined with other promotions or discounts (PWD/Senior).</li>
        <li>Lost loyalty codes will not be replaced or transferred.</li>
        <li>Loyalty cards are applicable for walk-in and direct online (message us) orders only.</li>
      </ul>
      <h4>Exclusions</h4>
      <ul>
        <li>Pastries and ready-to-eat items.</li>
        <li>Substituted milk options or free add-ons.</li>
        <li>GrabFood / Foodpanda delivery orders.</li>
      </ul>
    </div>

    <div class="footer">
      <div class="line1">LAYOVER Coffee — In Transit</div>
      <div>+63 956 358 5888</div>
      <div>Bldg 16, unit 115 Urban Deca Homes<br>Hernan Cortes, Mandaue Cebu City</div>
    </div>

    <button class="text-link" id="cancelCardBtn">Deactivate my loyalty card</button>
  `;
  document.getElementById('cancelCardBtn').onclick = async () => {
    if (!confirm('Deactivate this loyalty card? You can ask staff to reactivate it later, but it will stop working until then.')) return;
    const res = await callApi({ action: 'cancel', code: state.code });
    if (res.ok) renderCancelled(res);
  };
}

function renderStaffCheckIn(state, justAdded) {
  if (state.cancelled) {
    app.innerHTML = `
      <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee — Staff</strong></div>
      <div class="staff-box">
        <h2>${escapeHtml(state.name)} — card deactivated</h2>
        <input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN">
        <button class="btn primary" id="reactivateBtn">Reactivate Card</button>
        <div id="staffMsg" class="msg"></div>
      </div>
    `;
    const msg = document.getElementById('staffMsg');
    document.getElementById('reactivateBtn').onclick = async () => {
      msg.textContent = 'Reactivating…'; msg.className = 'msg';
      const res = await callApi({ action: 'reactivate', code: state.code, pin: document.getElementById('pin').value });
      if (res.ok) { renderStaffCheckIn(res); }
      else { msg.textContent = res.error; msg.className = 'msg error'; }
    };
    return;
  }

  const readyForReward = state.stamps >= 12;
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee — Staff</strong></div>
    <div class="staff-box">
      ${justAdded ? `<div class="stamp-success">&#9989; Stamp added successfully!</div>` : ''}
      <h2>${escapeHtml(state.name)} — ${state.stamps}/12 stamps</h2>
      ${state.bonusThisVisit ? `<div class="msg ok">Bonus this visit: ${state.bonusThisVisit}</div>` : ''}
      <input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN">
      ${readyForReward
        ? `<button class="btn gold" id="redeemBtn">Redeem Free Coffee/Treat &amp; Reset</button>`
        : `<button class="btn primary" id="stampBtn">+ Add 1 Stamp</button>`}
      <div id="staffMsg" class="msg"></div>
    </div>
  `;
  const msg = document.getElementById('staffMsg');
  const pin = () => document.getElementById('pin').value;
  const stampBtn = document.getElementById('stampBtn');
  if (stampBtn) stampBtn.onclick = async () => {
    msg.textContent = 'Adding…'; msg.className = 'msg';
    const res = await callApi({ action: 'addStamp', code: state.code, pin: pin() });
    if (res.ok) { renderStaffCheckIn(res, true); }
    else { msg.textContent = res.error; msg.className = 'msg error'; }
  };
  const redeemBtn = document.getElementById('redeemBtn');
  if (redeemBtn) redeemBtn.onclick = async () => {
    msg.textContent = 'Redeeming…'; msg.className = 'msg';
    const res = await callApi({ action: 'redeem', code: state.code, pin: pin() });
    if (res.ok) { renderStaffCheckIn(res); }
    else { msg.textContent = res.error; msg.className = 'msg error'; }
  };
}

function renderSignup() {
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee — Staff</strong></div>
    <div class="staff-box">
      <h2>New Loyalty Card</h2>
      <input id="custName" placeholder="Customer name">
      <input id="custPhone" placeholder="Phone (optional)">
      <div style="font-size:11px;color:var(--muted);margin:-4px 0 6px;">Birthday (optional) — for a birthday greeting</div>
      <input id="custBirthday" type="date">
      <input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN">
      <button class="btn primary" id="createBtn">Create Card</button>
      <div id="staffMsg" class="msg"></div>
    </div>
    <button class="text-link" id="toBroadcastBtn">Send a Promo Blast instead</button>
  `;
  document.getElementById('toBroadcastBtn').onclick = () => { location.href = pageUrl({ staff: '1', broadcast: '1' }); };
  document.getElementById('createBtn').onclick = async () => {
    const msg = document.getElementById('staffMsg');
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const birthdayRaw = document.getElementById('custBirthday').value; // 'YYYY-MM-DD' or ''
    const birthday = birthdayRaw ? birthdayRaw.slice(5) : ''; // 'MM-DD'
    const pin = document.getElementById('pin').value;
    if (!name) { msg.textContent = 'Name is required'; msg.className = 'msg error'; return; }
    msg.textContent = 'Creating…'; msg.className = 'msg';
    const res = await callApi({ action: 'newCustomer', name, phone, pin, birthday });
    if (res.ok) {
      const link = pageUrl({ code: res.code });
      const signupQr = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(link);
      app.innerHTML = `
        <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee — Staff</strong></div>
        <div class="staff-box">
          <h2>Card created for ${escapeHtml(res.name)}</h2>
          <p style="font-size:13px;">Code: <b>${res.code}</b></p>
          <div class="qr-wrap">
            <img src="${signupQr}" alt="Customer card QR">
            <div class="hint">Have the customer scan this with their phone camera to open their card</div>
          </div>
          <p style="font-size:13px;word-break:break-all;">${link}</p>
          <button class="btn primary" id="copyBtn">Copy Link</button>
          <button class="btn gold" id="anotherBtn">Create Another</button>
        </div>`;
      document.getElementById('copyBtn').onclick = () => navigator.clipboard.writeText(link);
      document.getElementById('anotherBtn').onclick = () => { location.href = pageUrl({ staff: '1' }); };
    } else { msg.textContent = res.error; msg.className = 'msg error'; }
  };
}

function renderSelfSignup() {
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee</strong></div>
    <div class="staff-box">
      <h2>Join Layover Loyalty Stamp</h2>
      <p style="font-size:13px;color:var(--muted);margin-top:-6px;">Get your own digital stamp card - earn free drinks and treats as you go.</p>
      <input id="custName" placeholder="Your name">
      <input id="custPhone" placeholder="Phone (optional)">
      <div style="font-size:11px;color:var(--muted);margin:-4px 0 6px;">Birthday (optional) - for a birthday greeting</div>
      <input id="custBirthday" type="date">
      <button class="btn primary" id="joinBtn">Create My Card</button>
      <div id="joinMsg" class="msg"></div>
    </div>
  `;
  const msg = document.getElementById('joinMsg');
  document.getElementById('joinBtn').onclick = async () => {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const birthdayRaw = document.getElementById('custBirthday').value;
    const birthday = birthdayRaw ? birthdayRaw.slice(5) : '';
    if (!name) { msg.textContent = 'Please enter your name'; msg.className = 'msg error'; return; }
    msg.textContent = 'Creating your card…'; msg.className = 'msg';
    const res = await callApi({ action: 'selfSignup', name, phone, birthday });
    if (res.ok) {
      location.href = pageUrl({ code: res.code });
    } else {
      msg.textContent = res.error; msg.className = 'msg error';
    }
  };
}

function renderSelfStamp() {
  const savedCode = localStorage.getItem('layoverLoyaltyCode') || '';
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee</strong></div>
    <div class="staff-box">
      <h2>Add Your Stamp</h2>
      <p style="font-size:13px;color:var(--muted);margin-top:-6px;">Enter the loyalty code from your card to add a stamp for this visit.</p>
      <input id="selfCode" placeholder="Your loyalty code" value="${escapeHtml(savedCode)}" style="text-transform:uppercase;">
      <button class="btn primary" id="selfStampBtn">Add My Stamp</button>
      <div id="selfMsg" class="msg"></div>
    </div>
  `;
  const msg = document.getElementById('selfMsg');
  document.getElementById('selfStampBtn').onclick = async () => {
    const code = document.getElementById('selfCode').value.trim().toUpperCase();
    if (!code) { msg.textContent = 'Enter your loyalty code'; msg.className = 'msg error'; return; }
    msg.textContent = 'Adding your stamp…'; msg.className = 'msg';
    const res = await callApi({ action: 'selfStamp', code });
    if (res.ok) {
      localStorage.setItem('layoverLoyaltyCode', code);
      msg.textContent = res.bonusThisVisit
        ? `Stamp added! ${res.stamps}/12 — you unlocked ${res.bonusThisVisit}!`
        : `Stamp added! Now at ${res.stamps}/12.`;
      msg.className = 'msg ok';
    } else {
      msg.textContent = res.error;
      msg.className = 'msg error';
    }
  };
}

function renderBroadcast() {
  app.innerHTML = `
    <div class="logo-row"><img src="logo.png" alt=""><strong>Layover Coffee — Staff</strong></div>
    <div class="staff-box">
      <h2>Send a Promo Blast</h2>
      <p style="font-size:12px;color:var(--muted);margin-top:-6px;">Queues this message for every active customer with a phone number. No SMS provider is connected yet — after queueing, open the <b>Notifications</b> tab in the Layover Loyalty sheet and send each one manually (SMS/Messenger). Cancelled cards are skipped automatically.</p>
      <textarea id="promoMsg" class="promo-input" rows="4" placeholder="e.g. Flight of the Month is back this week — buy 1 take 1 on iced lattes, today only!"></textarea>
      <input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN">
      <button class="btn primary" id="sendBtn">Queue to All Active Customers</button>
      <div id="staffMsg" class="msg"></div>
    </div>
    <button class="text-link" id="toSignupBtn">Create a New Card instead</button>
  `;
  document.getElementById('toSignupBtn').onclick = () => { location.href = pageUrl({ staff: '1' }); };
  document.getElementById('sendBtn').onclick = async () => {
    const msg = document.getElementById('staffMsg');
    const message = document.getElementById('promoMsg').value.trim();
    const pin = document.getElementById('pin').value;
    if (!message) { msg.textContent = 'Message is required'; msg.className = 'msg error'; return; }
    msg.textContent = 'Queueing…'; msg.className = 'msg';
    const res = await callApi({ action: 'broadcast', message, pin });
    if (res.ok) { msg.textContent = `Queued for ${res.queued} customer${res.queued === 1 ? '' : 's'} — check the Notifications tab.`; msg.className = 'msg ok'; }
    else { msg.textContent = res.error; msg.className = 'msg error'; }
  };
}

async function callApi(paramsObj) {
  const url = API_URL + '?' + new URLSearchParams(paramsObj).toString();
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    return await res.json();
  } catch (e) {
    const timedOut = e.name === 'AbortError';
    return { ok: false, error: timedOut ? 'This is taking too long — check your connection and try again.' : 'Network error — check your connection' };
  } finally {
    clearTimeout(timeoutId);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

(async function init() {
  if (isSelfSignup) { renderSelfSignup(); return; }
  if (isSelfStamp) { renderSelfStamp(); return; }
  if (isStaff && isBroadcast) { renderBroadcast(); return; }
  if (isStaff && !code) { renderSignup(); return; }
  if (!code) {
    app.innerHTML = '<div class="not-found">No loyalty code found in this link.<br>Ask staff for your Layover Loyalty link.</div>';
    return;
  }
  const state = await callApi({ action: 'lookup', code });
  if (!state.ok) {
    app.innerHTML = `<div class="not-found">${escapeHtml(state.error || 'Card not found')}</div>`;
    return;
  }
  if (isStaff) renderStaffCheckIn(state); else renderCustomer(state);
})();
</script>
