<!-- Layover Coffee — link-in-bio funnel page. Fully standalone: no Apps Script, no POS
     backend, no build step. Put this URL in the Instagram/TikTok bio (and on any QR code)
     once hosted. Deliberately NOT a Linktree-style hub with many destinations — one
     dominant action (Message Us to Order, straight into Messenger), with hours/location
     as plain info underneath, not additional buttons competing with it.

     To update hours, location, promo, or links: edit the values directly below (search
     for "EDIT ME"), save, and re-upload wherever this is hosted (or `git push` if using
     the layover-coffee-links repo — GitHub Pages redeploys automatically). logo.png must
     stay in the same folder as this file. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layover Coffee</title>
  <style>
    :root {
      /* Sampled directly from the real logo/menu artwork (Layover/1.jpg), not invented. */
      --blue: #1e3fae; --blue-dark: #142b78; --ink: #1c2438; --line: #dbe2f2; --muted: #6b7488;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; margin: 0; min-height: 100vh;
      background: #ffffff;
      color: var(--ink);
      display: flex; justify-content: center;
    }
    .page { width: 100%; max-width: 420px; padding: 40px 20px 40px; }

    .logo { display: block; width: 55%; max-width: 230px; height: auto; margin: 0 auto; }
    .tagline { text-align: center; font-size: 13px; color: var(--muted); margin: 6px 0 30px; }

    .promo {
      background: var(--blue); color: #fff; text-align: center;
      padding: 9px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;
    }

    .cta {
      display: block; text-align: center; text-decoration: none;
      background: var(--blue); color: #fff; border: 1px solid var(--blue-dark);
      border-radius: 14px; padding: 20px 16px; box-shadow: 0 3px 0 var(--blue-dark);
      margin-bottom: 28px;
    }
    .cta:active { box-shadow: none; transform: translateY(3px); }
    .cta .title { font-size: 18px; font-weight: 700; }
    .cta .sub { font-size: 12.5px; margin-top: 4px; color: rgba(255,255,255,0.9); }

    .info-row {
      text-decoration: none; color: var(--ink);
      display: flex; gap: 12px; align-items: baseline;
      padding: 10px 4px; border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }
    .info-row:last-of-type { border-bottom: none; }
    .info-row .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; min-width: 64px; flex-shrink: 0; }

    .social { display: flex; justify-content: center; gap: 14px; margin: 28px 0 8px; }
    .social a {
      width: 40px; height: 40px; border-radius: 50%; background: var(--blue);
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
    }

    .footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 22px; }
    .footer .line1 { color: var(--blue); font-weight: 600; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="page">
    <img class="logo" src="logo.png" alt="Layover Coffee">
    <p class="tagline">Your next stop for coffee and treats.</p>

    <!-- EDIT ME: delete this whole <div class="promo">...</div> block when no promo is running.
         Never leave a promo here that isn't actually active — see Voice Brain truth rules. -->
    <!--
    <div class="promo">🎉 Buy 1 Take 1 Iced Spanish Latte, until July 20</div>
    -->

    <a class="cta" href="https://m.me/100078084416611?text=Hi!%20I%20want%20to%20order%20please%20%F0%9F%98%8A">
      <div class="title">💬 Message Us to Order</div>
      <div class="sub">Tap to start ordering on Messenger — real replies, real fast</div>
    </a>

    <div class="info-row">
      <span class="label">Hours</span>
      <!-- EDIT ME: BUSINESS_HOURS -->
      <span>Open daily, 9:00 AM–3:00 AM</span>
    </div>
    <a class="info-row" href="https://share.google/FFeu1e0yfBBOAFOCL" target="_blank" rel="noopener">
      <span class="label">Location</span>
      <!-- EDIT ME: LOCATION_ADDRESS (linked to your Google Maps share link above) -->
      <span>Urban Deca Homes Hernan Cortes, across Bldg. 14</span>
    </a>

    <!-- EDIT ME: delete any <a> below for a social you don't have yet. -->
    <div class="social">
      <a href="https://www.facebook.com/profile.php?id=100078084416611" target="_blank" rel="noopener" aria-label="Facebook">FB</a>
      <!-- <a href="https://instagram.com/YOUR_HANDLE" target="_blank" rel="noopener" aria-label="Instagram">IG</a> -->
      <!-- <a href="https://tiktok.com/@YOUR_HANDLE" target="_blank" rel="noopener" aria-label="TikTok">TT</a> -->
    </div>

    <div class="footer">
      <div class="line1">We're ready when you are 😊</div>
      <div>See you at Layover ☕</div>
    </div>
  </div>
</body>
</html>
